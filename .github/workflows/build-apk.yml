name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA / APK Configuration
        run: |
          mkdir -p android-build
          cd android-build
          # Generate bubblewrap config from web manifest
          npx @bubblewrap/cli init --manifest=../client/public/manifest.webmanifest --skipPwaValidation || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Gadhaa Release ${{ github.ref_name || 'v1.0.0' }}
          body: |
            🃏 **Gadhaa (ଗଧା) Android APK & Web Release**
            
            - Real-time multiplayer card game
            - Built-in live WebRTC voice chat
            - Odia & English language support
            - Download `gadhaa.apk` below and install directly on any Android phone!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
